<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Canonical URLs have no trailing slash. Old /foo/ links still load (foo/index.html),
      // so drop the slash before the app hydrates; each page was pre-rendered for /foo.
      (function () {
        var p = location.pathname;
        if (p.length > 1 && p.slice(-1) === "/")
          history.replaceState(null, "", p.replace(/\/+$/, "") + location.search + location.hash);
      })();
    </script>
    <link rel="icon" href="/favicon.ico?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0c0c0c" />
    <meta name="google-site-verification" content="SFKXE3L3OEip8Idv3TM6_6xnOSYNaPxPr-_LFAArrB0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  </body>
</html>
